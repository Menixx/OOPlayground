<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OOPlayground – Erklärung</title>
  <!-- Favicon: Browser nehmen das letzte passende <link>; WebP (kleiner) bevorzugt, PNG als Rückfall -->
  <link rel="icon" type="image/png" href="./icons/favicon.png" />
  <link rel="icon" type="image/webp" href="./icons/favicon.webp" />
  <script>
    // Farbschema vor dem ersten Zeichnen setzen (kein helles Aufblitzen) – Logik wie in src/services/Theme.js
    try { var m = localStorage.getItem('ooplayground.theme'); } catch (e) {}
    document.documentElement.dataset.theme = m === 'light' || m === 'dark' ? m
      : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400..700&display=swap" />
  <script type="module" src="/src/docs/main.js"></script>
</head>
<body class="docs">
  <a class="skip-link" href="#inhalt" data-i18n="docs.skip">Zum Inhalt springen</a>
  <header class="topbar" id="topbar"></header>
  <div class="docs-layout">
    <div class="toc-backdrop" id="toc-backdrop" hidden></div>
    <nav class="toc" id="toc" aria-label="Inhalt"></nav>
    <main class="docs-main" id="inhalt" tabindex="-1"></main>
  </div>
  <button type="button" class="to-top" id="to-top" hidden></button>
</body>
</html>
