<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OOPlayground</title>
  <!-- Favicon: Browser nehmen das letzte passende <link>; WebP (kleiner) bevorzugt, PNG als Rückfall -->
  <link rel="icon" type="image/png" href="./icons/favicon.png" />
  <link rel="icon" type="image/webp" href="./icons/favicon.webp" />
  <script>
    // Farbschema vor dem ersten Zeichnen setzen (kein helles Aufblitzen) – Logik wie in src/services/Theme.js
    try { var m = localStorage.getItem('ooplayground.theme'); } catch (e) {}
    document.documentElement.dataset.theme = m === 'light' || m === 'dark' ? m
      : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400..700&display=swap" />
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <header id="header"></header>
  <main>
    <section aria-labelledby="h-klassen"><h2 id="h-klassen" data-i18n="section.classes">Abstrakte Klassen</h2><div id="class-panel"></div></section>
    <section aria-labelledby="h-objekte"><h2 id="h-objekte" data-i18n="section.objects">Erstellte Objekte</h2><div id="workspace"></div></section>
    <section aria-labelledby="h-ausgabe"><h2 id="h-ausgabe" data-i18n="section.output">Ausgabe</h2><div id="console"></div></section>
  </main>
</body>
</html>
