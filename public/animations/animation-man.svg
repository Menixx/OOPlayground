<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" class="state-pizza">
  <defs>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFDFB0"/>
      <stop offset="100%" stop-color="#F5B87A"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6D4C41"/>
      <stop offset="100%" stop-color="#3E2723"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#42A5F5"/>
      <stop offset="100%" stop-color="#1E88E5"/>
    </linearGradient>
    <linearGradient id="pantsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3949AB"/>
      <stop offset="100%" stop-color="#1A237E"/>
    </linearGradient>
    <linearGradient id="pizzaCheese" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <linearGradient id="pizzaCrust" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E69A4C"/>
      <stop offset="100%" stop-color="#BF6B23"/>
    </linearGradient>
  </defs>

  <!--
    УПРАВЛІННЯ АНІМАЦІЯМИ ЧЕРЕЗ КЛАСИ НА КОРЕНЕВОМУ <svg>:
    - class="state-idle"  : людина стоїть спокійно
    - class="state-walk"  : анімація ходьби (за замовчуванням у демо або через JS)
    - class="state-pizza" : людина стоїть, дістає з-за спини шматок піци, відкушує і ховає відкушений шматок назад за спину
  -->
  <style>
    /* За замовчуванням усі трансформації скинуті (стан спокою) */
    #person-root, #left-leg, #right-leg, #left-arm, #right-arm, #pizza-slice {
      transform-box: view-box;
    }

    /* ================= 1. АНІМАЦІЯ ХОДЬБИ (.state-walk) ================= */
    svg.state-walk #person-root {
      animation: walkBob 0.9s ease-in-out infinite;
    }
    svg.state-walk #left-leg {
      transform-origin: 54px 78px;
      animation: leftLegWalk 0.9s ease-in-out infinite;
    }
    svg.state-walk #right-leg {
      transform-origin: 74px 78px;
      animation: rightLegWalk 0.9s ease-in-out infinite;
    }
    svg.state-walk #left-arm {
      transform-origin: 43px 49px;
      animation: leftArmWalk 0.9s ease-in-out infinite;
    }
    svg.state-walk #right-arm {
      transform-origin: 85px 49px;
      animation: rightArmWalk 0.9s ease-in-out infinite;
    }
    svg.state-walk #pizza-slice {
      opacity: 0;
    }

    @keyframes walkBob {
      0%, 50%, 100% { transform: translateY(0px); }
      25%, 75% { transform: translateY(-2.5px); }
    }
    @keyframes leftLegWalk {
      0%, 100% { transform: rotate(-22deg) translateY(-2px); }
      50% { transform: rotate(22deg) translateY(0px); }
    }
    @keyframes rightLegWalk {
      0%, 100% { transform: rotate(22deg) translateY(0px); }
      50% { transform: rotate(-22deg) translateY(-2px); }
    }
    @keyframes leftArmWalk {
      0%, 100% { transform: rotate(14deg); }
      50% { transform: rotate(-14deg); }
    }
    @keyframes rightArmWalk {
      0%, 100% { transform: rotate(-14deg); }
      50% { transform: rotate(14deg); }
    }

    /* ================= 2. АНІМАЦІЯ ПОЇДАННЯ ПІЦИ (.state-pizza) ================= */
    /* Цикл 3.6с:
       0-15%  : права рука заводиться за спину
       15-40% : рука згинається від нерухомого плеча та підносить піцу до рота
       40-60% : укус (відкриття/закриття рота, легкий кивок головою, заміна піци на відкушену)
       60-85% : рука ховає відкушений шматок назад за спину
       85-100%: рука повертається у вихідне положення
    */
svg.state-pizza #pizza-slice {
      transform-origin: 88px 72px;
      animation: pizzaMove 3.6s ease-in-out infinite;
    }
    svg.state-pizza #pizza-whole {
      animation: showWholePizza 3.6s steps(1, end) infinite;
    }
    svg.state-pizza #pizza-bitten {
      animation: showBittenPizza 3.6s steps(1, end) infinite;
    }
    svg.state-pizza #mouth-smile {
      animation: hideSmileOnBite 3.6s steps(1, end) infinite;
    }
    svg.state-pizza #mouth-bite {
      animation: showMouthBite 3.6s steps(1, end) infinite;
    }
    svg.state-pizza #head-group {
      transform-origin: 64px 36px;
      animation: headChew 3.6s ease-in-out infinite;
    }
    @keyframes pizzaMove {
      0%, 14% {
        opacity: 0;
        transform: translate(-12px, -4px) rotate(25deg);
      }
      18% {
        opacity: 1;
        transform: translate(-12px, -4px) rotate(25deg);
      }
      38%, 58% {
        opacity: 1;
        transform: translate(-24px, -42px) rotate(-35deg);
      }
      80% {
        opacity: 1;
        transform: translate(-12px, -4px) rotate(25deg);
      }
      84%, 100% {
        opacity: 0;
        transform: translate(-12px, -4px) rotate(25deg);
      }
    }

    /* До 48% (момент укусу) видно цілу піцу, після 48% — відкушену */
    @keyframes showWholePizza {
      0%, 47.9% { opacity: 1; }
      48%, 100% { opacity: 0; }
    }
    @keyframes showBittenPizza {
      0%, 47.9% { opacity: 0; }
      48%, 100% { opacity: 1; }
    }

    /* Рот відкривається перед укусом (38% - 50%), потім жує */
    @keyframes hideSmileOnBite {
      0%, 37.9% { opacity: 1; }
      38%, 50% { opacity: 0; }
      50.1%, 100% { opacity: 1; }
    }
    @keyframes showMouthBite {
      0%, 37.9% { opacity: 0; }
      38%, 50% { opacity: 1; }
      50.1%, 100% { opacity: 0; }
    }

    @keyframes headChew {
      0%, 36% { transform: rotate(0deg) translateY(0); }
      44% { transform: rotate(4deg) translateY(1px); }
      50% { transform: rotate(0deg) translateY(0); }
      56%, 64%, 72% { transform: translateY(1px); }
      60%, 68%, 76%, 100% { transform: translateY(0); }
    }

    /* Початковий стан при відкритті без JS */
    #pizza-slice, #pizza-bitten, #mouth-bite { opacity: 0; }
  </style>

  <!-- Анімована постать людини (за замовчуванням встановлено class="state-pizza" для перегляду, змінюйте на state-walk або state-idle) -->
  <g id="person-root">

    <!-- Ліва нога -->
    <g id="left-leg">
      <path d="M 48 76 L 61 76 L 57 114 L 46 114 Z"
            fill="url(#pantsGrad)" stroke="#1A237E" stroke-width="2" stroke-linejoin="round"/>
      <path d="M 46 113 L 57 113 L 57 119 C 57 121, 55 122, 52 122 L 43 122 C 40 122, 39 119, 41 117 Z"
            fill="#37474F" stroke="#263238" stroke-width="1.8" stroke-linejoin="round"/>
    </g>

    <!-- Права нога -->
    <g id="right-leg">
      <path d="M 67 76 L 80 76 L 82 114 L 71 114 Z"
            fill="url(#pantsGrad)" stroke="#1A237E" stroke-width="2" stroke-linejoin="round"/>
      <path d="M 71 113 L 82 113 L 87 117 C 89 119, 88 122, 85 122 L 76 122 C 73 122, 71 121, 71 119 Z"
            fill="#37474F" stroke="#263238" stroke-width="1.8" stroke-linejoin="round"/>
    </g>

    <!-- Поясна частина штанів -->
    <path d="M 48 75 L 80 75 L 79 88 L 66 88 L 64 85 L 62 88 L 49 88 Z"
          fill="url(#pantsGrad)" stroke="#1A237E" stroke-width="2" stroke-linejoin="round"/>

    <!-- Ліва рука -->
    <g id="left-arm">
      <path d="M 45 47 C 39 49, 36 60, 36 74 C 36 78, 42 78, 42 74 C 42 65, 44 57, 47 54 Z"
            fill="url(#skinGrad)" stroke="#C68642" stroke-width="1.8" stroke-linejoin="round"/>
    </g>

    <!-- Футболка / торс -->
    <path d="M 45 45 C 48 43, 56 42, 64 42 C 72 42, 80 43, 83 45 L 88 55 L 81 58 L 80 77 L 48 77 L 47 58 L 40 55 Z"
          fill="url(#shirtGrad)" stroke="#1565C0" stroke-width="2" stroke-linejoin="round"/>

    <!-- Шия -->
    <rect x="59" y="36" width="10" height="8" rx="3" fill="url(#skinGrad)" stroke="#C68642" stroke-width="1.6"/>

    <!-- Голова (окрема група для легкого руху під час укусу) -->
    <g id="head-group">
      <!-- Вуха -->
      <circle cx="48" cy="24" r="3.5" fill="url(#skinGrad)" stroke="#C68642" stroke-width="1.6"/>
      <circle cx="80" cy="24" r="3.5" fill="url(#skinGrad)" stroke="#C68642" stroke-width="1.6"/>

      <!-- Обличчя -->
      <ellipse cx="64" cy="23" rx="15.5" ry="16.5" fill="url(#skinGrad)" stroke="#C68642" stroke-width="2"/>

      <!-- Волосся -->
      <path d="M 48 22 C 47 11, 54 6, 64 6 C 74 6, 81 11, 80 22 C 79 16, 75 13, 69 14 C 64 15, 58 13, 53 15 C 50 16, 49 19, 48 22 Z"
            fill="url(#hairGrad)" stroke="#2C1A16" stroke-width="1.8" stroke-linejoin="round"/>

      <!-- Очі -->
      <circle cx="58.5" cy="23" r="2" fill="#3E2723"/>
      <circle cx="69.5" cy="23" r="2" fill="#3E2723"/>
      <circle cx="57.9" cy="22.3" r="0.7" fill="#FFFFFF"/>
      <circle cx="68.9" cy="22.3" r="0.7" fill="#FFFFFF"/>

      <!-- Рум'янець -->
      <ellipse cx="55" cy="27" rx="2.5" ry="1.4" fill="#FF8A80" opacity="0.5"/>
      <ellipse cx="73" cy="27" rx="2.5" ry="1.4" fill="#FF8A80" opacity="0.5"/>

      <!-- Рот: звичайна посмішка -->
      <path id="mouth-smile" d="M 60 29 C 62 31.5, 66 31.5, 68 29" fill="none" stroke="#5D4037" stroke-width="1.8" stroke-linecap="round"/>

      <!-- Рот: відкритий для укусу піци -->
      <ellipse id="mouth-bite" cx="64" cy="30" rx="3.2" ry="2.6" fill="#8D3B32" stroke="#5D4037" stroke-width="1.4"/>
    </g>

    <!-- Права рука: суцільний контур із нерухомою точкою плеча -->
    <g id="right-arm">
      <path id="right-arm-shape"
            d="M 83 47
               C 89 49, 92 60, 92 74
               C 92 78, 86 78, 86 74
               C 86 65, 84 57, 81 54 Z"
            fill="url(#skinGrad)" stroke="#C68642" stroke-width="1.8"
            stroke-linejoin="round">
        <!-- У кожному положенні перша точка M 83 47 залишається на плечі.
             Змінюється лише вигин руки: вниз -> зігнута до рота -> вниз. -->
        <animate attributeName="d"
          dur="3.6s"
          repeatCount="indefinite"
          calcMode="spline"
          keyTimes="0; 0.14; 0.38; 0.58; 0.82; 1"
          keySplines="0.42 0 0.58 1; 0.42 0 0.58 1; 0 0 1 1; 0.42 0 0.58 1; 0.42 0 0.58 1"
          values="
            M 83 47 C 89 49, 92 60, 92 74 C 92 78, 86 78, 86 74 C 86 65, 84 57, 81 54 Z;
            M 83 47 C 88 48, 91 56, 91 67 C 91 72, 85 73, 84 68 C 83 60, 82 54, 81 54 Z;
            M 83 47 C 79 42, 75 36, 70 30 C 67 26, 62 29, 65 33 C 69 40, 75 49, 80 55 C 83 58, 87 54, 84 50 Z;
            M 83 47 C 79 42, 75 36, 70 30 C 67 26, 62 29, 65 33 C 69 40, 75 49, 80 55 C 83 58, 87 54, 84 50 Z;
            M 83 47 C 88 48, 91 56, 91 67 C 91 72, 85 73, 84 68 C 83 60, 82 54, 81 54 Z;
            M 83 47 C 89 49, 92 60, 92 74 C 92 78, 86 78, 86 74 C 86 65, 84 57, 81 54 Z" />
      </path>
    </g>


    <!-- Шматок піци (намальований поверх голови, щоб бути перед обличчям під час укусу) -->
    <g id="pizza-slice">
      <!-- 1. Цілий шматок піци -->
      <g id="pizza-whole">
        <!-- Сирна основа -->
        <polygon points="88,74 102,55 111,67" fill="url(#pizzaCheese)" stroke="#E65100" stroke-width="1.5" stroke-linejoin="round"/>
        <!-- Скоринка -->
        <path d="M 101 54 C 106 57, 110 62, 112 68 L 109 69 C 107 64, 104 59, 99 56 Z"
              fill="url(#pizzaCrust)" stroke="#8D4004" stroke-width="1.3" stroke-linejoin="round"/>
        <!-- Пепероні -->
        <circle cx="99" cy="64" r="2.2" fill="#D32F2F"/>
        <circle cx="104" cy="63" r="1.8" fill="#D32F2F"/>
        <circle cx="95" cy="69" r="1.6" fill="#D32F2F"/>
      </g>

      <!-- 2. Відкушений шматок піци (без гострого кінчика, зі слідом від укусу) -->
      <g id="pizza-bitten">
        <path d="M 94 66
                 C 95 65, 96 66, 97 65
                 C 98 64, 98 63, 99 63
                 L 102 55
                 L 111 67
                 L 98 71
                 C 97 70, 96 70, 95 69
                 C 94 68, 94 67, 94 66 Z"
              fill="url(#pizzaCheese)" stroke="#E65100" stroke-width="1.5" stroke-linejoin="round"/>
        <!-- Скоринка -->
        <path d="M 101 54 C 106 57, 110 62, 112 68 L 109 69 C 107 64, 104 59, 99 56 Z"
              fill="url(#pizzaCrust)" stroke="#8D4004" stroke-width="1.3" stroke-linejoin="round"/>
        <!-- Пепероні -->
        <circle cx="102" cy="63" r="2" fill="#D32F2F"/>
        <circle cx="105" cy="66" r="1.7" fill="#D32F2F"/>
      </g>
    </g>


  </g>
</svg>