<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" class="state-pizza">
  <defs>
    <linearGradient id="skinGrad" gradientUnits="userSpaceOnUse" x1="0" y1="10" x2="0" y2="85">
      <stop offset="0%" stop-color="#FFDFB0" />
      <stop offset="100%" stop-color="#F5B87A" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6D4C41" />
      <stop offset="100%" stop-color="#3E2723" />
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#42A5F5" />
      <stop offset="100%" stop-color="#1E88E5" />
    </linearGradient>
    <linearGradient id="pantsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3949AB" />
      <stop offset="100%" stop-color="#1A237E" />
    </linearGradient>
    <linearGradient id="pizzaCheese" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#FFB300" />
    </linearGradient>
    <linearGradient id="pizzaCrust" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E69A4C" />
      <stop offset="100%" stop-color="#BF6B23" />
    </linearGradient>
  </defs>

  <!--
    УПРАВЛІННЯ АНІМАЦІЯМИ ЧЕРЕЗ КЛАСИ НА КОРЕНЕВОМУ <svg>:
    - class="state-idle"  : людина стоїть спокійно
    - class="state-walk"  : анімація ходьби
    - class="state-pizza" : людина дістає шматок піци, природно згинає руку в лікті, відкушує і ховає шматок назад
  -->
  <style>
    #person-root, #head-group, #left-leg, #right-leg,
    #left-upper-arm, #left-forearm, #left-hand,
    #right-upper-arm, #right-forearm, #right-hand {
      transform-box: view-box;
    }

    /* ================= 1. АНІМАЦІЯ ХОДЬБИ (.state-walk) ================= */
    svg.state-walk #person-root {
      animation: walkBob 0.9s ease-in-out infinite;
    }
    svg.state-walk #left-leg {
      transform-origin: 54px 77px;
      animation: leftLegWalk 0.9s ease-in-out infinite;
    }
    svg.state-walk #right-leg {
      transform-origin: 74px 77px;
      animation: rightLegWalk 0.9s ease-in-out infinite;
    }
    svg.state-walk #left-upper-arm {
      transform-origin: 46px 51px;
      animation: leftUpperArmWalk 0.9s ease-in-out infinite;
    }
    svg.state-walk #left-forearm {
      transform-origin: 42px 64px;
      animation: leftForearmWalk 0.9s ease-in-out infinite;
    }
    svg.state-walk #right-upper-arm {
      transform-origin: 82px 51px;
      animation: rightUpperArmWalk 0.9s ease-in-out infinite;
    }
    svg.state-walk #right-forearm {
      transform-origin: 86px 64px;
      animation: rightForearmWalk 0.9s ease-in-out infinite;
    }
    svg.state-walk #pizza-slice {
      opacity: 0;
    }

    @keyframes walkBob {
      0%, 50%, 100% { transform: translateY(0px); }
      25%, 75% { transform: translateY(-2.2px); }
    }
    @keyframes leftLegWalk {
      0%, 100% { transform: rotate(-20deg) translateY(-1.5px); }
      50% { transform: rotate(20deg) translateY(0px); }
    }
    @keyframes rightLegWalk {
      0%, 100% { transform: rotate(20deg) translateY(0px); }
      50% { transform: rotate(-20deg) translateY(-1.5px); }
    }
    @keyframes leftUpperArmWalk {
      0%, 100% { transform: rotate(14deg); }
      50% { transform: rotate(-14deg); }
    }
    @keyframes leftForearmWalk {
      0%, 100% { transform: rotate(-6deg); }
      50% { transform: rotate(-18deg); }
    }
    @keyframes rightUpperArmWalk {
      0%, 100% { transform: rotate(-14deg); }
      50% { transform: rotate(14deg); }
    }
    @keyframes rightForearmWalk {
      0%, 100% { transform: rotate(18deg); }
      50% { transform: rotate(6deg); }
    }

    /* ================= 2. АНІМАЦІЯ ПОЇДАННЯ ПІЦИ (.state-pizza) ================= */
    svg.state-pizza #right-upper-arm {
      transform-origin: 82px 51px;
      animation: pizzaUpperArm 3.6s cubic-bezier(0.42, 0, 0.58, 1) infinite;
    }
    svg.state-pizza #right-forearm {
      transform-origin: 86px 64px;
      animation: pizzaForearm 3.6s cubic-bezier(0.42, 0, 0.58, 1) infinite;
    }
    svg.state-pizza #right-hand {
      transform-origin: 85px 78px;
      animation: pizzaHandTilt 3.6s cubic-bezier(0.42, 0, 0.58, 1) infinite;
    }
    svg.state-pizza #left-upper-arm {
      transform-origin: 46px 51px;
      animation: leftBalance 3.6s ease-in-out infinite;
    }
    svg.state-pizza #pizza-slice {
      animation: pizzaVisibility 3.6s ease-in-out infinite;
    }
    svg.state-pizza #pizza-whole {
      animation: showWholePizza 3.6s steps(1, end) infinite;
    }
    svg.state-pizza #pizza-bitten {
      animation: showBittenPizza 3.6s steps(1, end) infinite;
    }
    svg.state-pizza #mouth-smile {
      animation: hideSmileOnBite 3.6s steps(1, end) infinite;
    }
    svg.state-pizza #mouth-bite {
      animation: showMouthBite 3.6s steps(1, end) infinite;
    }
    svg.state-pizza #head-group {
      transform-origin: 64px 36px;
      animation: headChew 3.6s ease-in-out infinite;
    }

    /* Плече: обертається навколо внутрішньої точки (82, 51) глибоко під рукавом */
    @keyframes pizzaUpperArm {
      0%, 100% { transform: rotate(0deg); }
      12%      { transform: rotate(-16deg); }
      38%      { transform: rotate(32deg); }
      46%      { transform: rotate(33deg); }
      56%      { transform: rotate(26deg); }
      82%      { transform: rotate(-16deg); }
    }

    /* Лікоть: природно згинається вгору */
    @keyframes pizzaForearm {
      0%, 100% { transform: rotate(0deg); }
      12%      { transform: rotate(-20deg); }
      38%      { transform: rotate(118deg); }
      46%      { transform: rotate(120deg); }
      56%      { transform: rotate(106deg); }
      82%      { transform: rotate(-20deg); }
    }

    /* Кисть: легкий доверт на 10°, щоб піднести кінчик до рота */
    @keyframes pizzaHandTilt {
      0%, 14%  { transform: rotate(0deg); }
      38%, 48% { transform: rotate(10deg); }
      56%      { transform: rotate(4deg); }
      80%, 100%{ transform: rotate(0deg); }
    }

    /* Легкий баланс лівої руки */
    @keyframes leftBalance {
      0%, 100% { transform: rotate(0deg); }
      42%      { transform: rotate(-3deg); }
    }

    @keyframes pizzaVisibility {
      0%, 10%   { opacity: 0; }
      14%, 80%  { opacity: 1; }
      84%, 100% { opacity: 0; }
    }

    @keyframes showWholePizza {
      0%, 45.9% { opacity: 1; }
      46%, 100% { opacity: 0; }
    }
    @keyframes showBittenPizza {
      0%, 45.9% { opacity: 0; }
      46%, 100% { opacity: 1; }
    }

    @keyframes hideSmileOnBite {
      0%, 36.9%   { opacity: 1; }
      37%, 48%    { opacity: 0; }
      48.1%, 100% { opacity: 1; }
    }
    @keyframes showMouthBite {
      0%, 36.9%   { opacity: 0; }
      37%, 48%    { opacity: 1; }
      48.1%, 100% { opacity: 0; }
    }

    @keyframes headChew {
      0%, 34%  { transform: rotate(0deg) translateY(0px); }
      43%      { transform: rotate(4deg) translateY(1px); }
      48%      { transform: rotate(0deg) translateY(0px); }
      54%, 62%, 70% { transform: translateY(1px); }
      58%, 66%, 74%, 100% { transform: translateY(0px); }
    }

    /* Початковий стан без анімацій (.state-idle) */
    #pizza-slice, #pizza-bitten, #mouth-bite { opacity: 0; }
    /* ================= 3. АНІМАЦІЯ РОЗМОВИ (.state-talk, метод lautGeben()) =================
       Цикл 2.4 секунди: людина махає лівою рукою, говорить (рот відкривається і закривається),
       збоку від голови з'являється хмаринка «Hi!» */
    #talk-bubble { opacity: 0; }
    svg.state-talk #left-upper-arm {
      transform-origin: 46px 51px;
      animation: talkUpperArm 2.4s ease-in-out infinite;
    }
    svg.state-talk #left-forearm {
      transform-origin: 42px 64px;
      animation: talkForearmWave 2.4s ease-in-out infinite;
    }
    svg.state-talk #head-group {
      transform-origin: 64px 36px;
      animation: talkHeadNod 2.4s ease-in-out infinite;
    }
    svg.state-talk #mouth-smile {
      animation: talkMouthSmile 2.4s steps(1, end) infinite;
    }
    svg.state-talk #mouth-bite {
      animation: talkMouthOpen 2.4s steps(1, end) infinite;
    }
    svg.state-talk #talk-bubble {
      transform-box: fill-box;
      transform-origin: 0% 100%;
      animation: talkBubble 2.4s ease-out infinite;
    }

    /* Рука піднімається вгору-вбік і тримається, поки передпліччя махає */
    @keyframes talkUpperArm {
      0%, 4%    { transform: rotate(0deg); }
      18%, 78%  { transform: rotate(140deg); }
      94%, 100% { transform: rotate(0deg); }
    }
    @keyframes talkForearmWave {
      0%, 18%   { transform: rotate(0deg); }
      26%       { transform: rotate(-22deg); }
      34%       { transform: rotate(18deg); }
      42%       { transform: rotate(-22deg); }
      50%       { transform: rotate(18deg); }
      58%       { transform: rotate(-22deg); }
      66%       { transform: rotate(18deg); }
      78%, 100% { transform: rotate(0deg); }
    }
    @keyframes talkHeadNod {
      0%, 16%, 84%, 100% { transform: rotate(0deg); }
      30%, 58% { transform: rotate(-3deg); }
      44%, 72% { transform: rotate(3deg); }
    }
    /* Губи: відкрито / закрито по черзі, наче людина вимовляє «Hal-lo!» */
    @keyframes talkMouthSmile {
      0%, 19.9%   { opacity: 1; }
      20%, 29.9%  { opacity: 0; }
      30%, 34.9%  { opacity: 1; }
      35%, 46.9%  { opacity: 0; }
      47%, 51.9%  { opacity: 1; }
      52%, 61.9%  { opacity: 0; }
      62%, 100%   { opacity: 1; }
    }
    @keyframes talkMouthOpen {
      0%, 19.9%   { opacity: 0; }
      20%, 29.9%  { opacity: 1; }
      30%, 34.9%  { opacity: 0; }
      35%, 46.9%  { opacity: 1; }
      47%, 51.9%  { opacity: 0; }
      52%, 61.9%  { opacity: 1; }
      62%, 100%   { opacity: 0; }
    }
    @keyframes talkBubble {
      0%, 16%   { opacity: 0; transform: scale(0.4); }
      26%       { opacity: 1; transform: scale(1.08); }
      32%, 74%  { opacity: 1; transform: scale(1); }
      86%, 100% { opacity: 0; transform: scale(0.9); }
    }
  </style>

  <g id="person-root">

    <!-- Ліва рука (починається всередині торсу під лівим рукавом, закінчується симетричною кистю) -->
    <g id="left-upper-arm">
      <path d="M 44 50 C 44 48.2, 48.5 48.2, 48.5 50 L 44.8 64 C 44.8 66.2, 39.2 66.2, 39.2 64 Z" fill="url(#skinGrad)" stroke="#C68642" stroke-width="1.8" stroke-linejoin="round" />
      <g id="left-forearm">
        <path d="M 39.4 64 C 39.4 62, 44.6 62, 44.6 64 L 44.6 77 C 44.6 79.4, 39.4 79.4, 39.4 77 Z" fill="url(#skinGrad)" stroke="#C68642" stroke-width="1.8" stroke-linejoin="round" />
        <!-- Безшовний згин ліктя -->
        <circle cx="42" cy="64" r="2.1" fill="url(#skinGrad)" />
        <!-- Симетрична кисть лівої руки -->
        <g id="left-hand">
          <ellipse cx="42" cy="78" rx="3.4" ry="2.5" fill="url(#skinGrad)" stroke="#C68642" stroke-width="1.5" />
        </g>
      </g>
    </g>

    <!-- Ліва нога -->
    <g id="left-leg">
      <path d="M 48 76 L 61 76 L 57 114 L 46 114 Z" fill="url(#pantsGrad)" stroke="#1A237E" stroke-width="2" stroke-linejoin="round" />
      <path d="M 46 113 L 57 113 L 57 119 C 57 121, 55 122, 52 122 L 43 122 C 40 122, 39 119, 41 117 Z" fill="#37474F" stroke="#263238" stroke-width="1.8" stroke-linejoin="round" />
    </g>

    <!-- Права нога -->
    <g id="right-leg">
      <path d="M 67 76 L 80 76 L 82 114 L 71 114 Z" fill="url(#pantsGrad)" stroke="#1A237E" stroke-width="2" stroke-linejoin="round" />
      <path d="M 71 113 L 82 113 L 87 117 C 89 119, 88 122, 85 122 L 76 122 C 73 122, 71 121, 71 119 Z" fill="#37474F" stroke="#263238" stroke-width="1.8" stroke-linejoin="round" />
    </g>

    <!-- Поясна частина штанів -->
    <path d="M 48 75 L 80 75 L 79 88 L 66 88 L 64 85 L 62 88 L 49 88 Z" fill="url(#pantsGrad)" stroke="#1A237E" stroke-width="2" stroke-linejoin="round" />

    <!-- Футболка / торс (повністю перекриває початок лівого плеча) -->
    <path d="M 45 45 C 48 43, 56 42, 64 42 C 72 42, 80 43, 83 45 L 88 55 L 81 58 L 80 77 L 48 77 L 47 58 L 40 55 Z" fill="url(#shirtGrad)" stroke="#1565C0" stroke-width="2" stroke-linejoin="round" />

    <!-- Шия -->
    <rect x="59" y="36" width="10" height="8" rx="3" fill="url(#skinGrad)" stroke="#C68642" stroke-width="1.6" />

    <!-- Голова -->
    <g id="head-group">
      <!-- Вуха -->
      <circle cx="48" cy="24" r="3.5" fill="url(#skinGrad)" stroke="#C68642" stroke-width="1.6" />
      <circle cx="80" cy="24" r="3.5" fill="url(#skinGrad)" stroke="#C68642" stroke-width="1.6" />

      <!-- Обличчя -->
      <ellipse cx="64" cy="23" rx="15.5" ry="16.5" fill="url(#skinGrad)" stroke="#C68642" stroke-width="2" />

      <!-- Волосся -->
      <path d="M 48 22 C 47 11, 54 6, 64 6 C 74 6, 81 11, 80 22 C 79 16, 75 13, 69 14 C 64 15, 58 13, 53 15 C 50 16, 49 19, 48 22 Z" fill="url(#hairGrad)" stroke="#2C1A16" stroke-width="1.8" stroke-linejoin="round" />

      <!-- Очі -->
      <circle cx="58.5" cy="23" r="2" fill="#3E2723" />
      <circle cx="69.5" cy="23" r="2" fill="#3E2723" />
      <circle cx="57.9" cy="22.3" r="0.7" fill="#FFFFFF" />
      <circle cx="68.9" cy="22.3" r="0.7" fill="#FFFFFF" />

      <!-- Рум'янець -->
      <ellipse cx="55" cy="27" rx="2.5" ry="1.4" fill="#FF8A80" opacity="0.5" />
      <ellipse cx="73" cy="27" rx="2.5" ry="1.4" fill="#FF8A80" opacity="0.5" />

      <!-- Рот: звичайна посмішка -->
      <path id="mouth-smile" d="M 60 29 C 62 31.5, 66 31.5, 68 29" fill="none" stroke="#5D4037" stroke-width="1.8" stroke-linecap="round" />

      <!-- Рот: відкритий для укусу піци -->
      <ellipse id="mouth-bite" cx="64" cy="30" rx="3.2" ry="2.6" fill="#8D3B32" stroke="#5D4037" stroke-width="1.4" />
    </g>

    <!-- Права рука (верхня точка 82, 50 схована глибоко під правим рукавом) -->
    <g id="right-upper-arm">
      <path d="M 79.5 50 C 79.5 48.2, 84 48.2, 84 50 L 88.8 64 C 88.8 66.2, 83.2 66.2, 83.2 64 Z" fill="url(#skinGrad)" stroke="#C68642" stroke-width="1.8" stroke-linejoin="round" />

      <g id="right-forearm">
        <path d="M 83.4 64 C 83.4 62, 88.6 62, 88.6 64 L 87.6 77 C 87.6 79.4, 82.4 79.4, 82.4 77 Z" fill="url(#skinGrad)" stroke="#C68642" stroke-width="1.8" stroke-linejoin="round" />
        <!-- Безшовне перекриття ліктьового згину -->
        <circle cx="86" cy="64" r="2.1" fill="url(#skinGrad)" />

        <!-- Кисть і шматок піци -->
        <g id="right-hand">
          <g id="pizza-slice">
            <!-- 1. Цілий шматок піци -->
            <g id="pizza-whole">
              <polygon points="79.5,78.5 90.5,78.5 84,96" fill="url(#pizzaCheese)" stroke="#E65100" stroke-width="1.5" stroke-linejoin="round" />
              <path d="M 78.5 77.5 C 82 76.5, 88 76.5, 91.5 77.5 L 90.5 80 C 87.5 79.2, 82.5 79.2, 79.5 80 Z" fill="url(#pizzaCrust)" stroke="#8D4004" stroke-width="1.3" stroke-linejoin="round" />
              <circle cx="83" cy="83.5" r="2" fill="#D32F2F" />
              <circle cx="86.8" cy="85.5" r="1.7" fill="#D32F2F" />
              <circle cx="84.2" cy="89.5" r="1.6" fill="#D32F2F" />
            </g>

            <!-- 2. Відкушений шматок піци -->
            <g id="pizza-bitten">
              <path d="M 79.5 78.5 L 90.5 78.5 L 87.2 89.5
                       C 86.4 88.6, 85.3 88.6, 84.5 89.4
                       C 83.7 88.5, 82.5 88.6, 81.8 89.5 Z" fill="url(#pizzaCheese)" stroke="#E65100" stroke-width="1.5" stroke-linejoin="round" />
              <path d="M 78.5 77.5 C 82 76.5, 88 76.5, 91.5 77.5 L 90.5 80 C 87.5 79.2, 82.5 79.2, 79.5 80 Z" fill="url(#pizzaCrust)" stroke="#8D4004" stroke-width="1.3" stroke-linejoin="round" />
              <circle cx="83" cy="83.5" r="2" fill="#D32F2F" />
              <circle cx="86.8" cy="85.5" r="1.7" fill="#D32F2F" />
            </g>
          </g>

          <!-- Кисть правої руки (симетрична лівій) -->
          <ellipse cx="85" cy="78" rx="3.4" ry="2.5" fill="url(#skinGrad)" stroke="#C68642" stroke-width="1.5" />
        </g>
      </g>
    </g>

    <!-- Накладка правого рукава: повністю закриває суглоб правого плеча при всіх кутах обертання -->
    <g id="right-sleeve-overlay">
      <path d="M 77 44.5 L 83 45 L 88 55 L 81 58 L 76.5 52 Z" fill="url(#shirtGrad)" />
      <path d="M 83 45 L 88 55 L 81 58" fill="none" stroke="#1565C0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
    </g>

  </g>

  <!-- Хмаринка репліки (видно лише при .state-talk) -->
  <g id="talk-bubble">
    <path d="M 88 2 L 120 2 C 124 2, 126 4, 126 8 L 126 18 C 126 22, 124 24, 120 24 L 92 24 L 84 30 L 86 24 C 84 23.5, 82 21.5, 82 18 L 82 8 C 82 4, 84 2, 88 2 Z" fill="#FFFFFF" stroke="#38BDF8" stroke-width="2" stroke-linejoin="round" />
    <text x="104" y="17.5" text-anchor="middle" font-family="system-ui, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#0284C7">Hi!</text>
  </g>
</svg>