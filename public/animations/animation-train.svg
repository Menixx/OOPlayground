<svg id="train-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Градієнти потяга -->
    <linearGradient id="trainTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ECEFF1" />
      <stop offset="100%" stop-color="#CFD8DC" />
    </linearGradient>
    <linearGradient id="trainStripe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E88E5" />
      <stop offset="100%" stop-color="#0D47A1" />
    </linearGradient>
    <linearGradient id="trainWindow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4FC3F7" />
      <stop offset="100%" stop-color="#0288D1" />
    </linearGradient>

    <!-- Світіння для електричних іскор пантографа -->
    <filter id="sparkGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* ==========================================================================
       БАЗОВІ НАЛАШТУВАННЯ ТА ОПОРНІ ТОЧКИ (TRANSFORM-ORIGIN)
       ========================================================================== */
    #train-chassis {
      transform-origin: 64px 70px;
    }
    /* Опорні точки для іскор біля пантографа */
    .spark-1 { transform-origin: 33px 23px; }
    .spark-2 { transform-origin: 45px 23px; }
    .spark-3 { transform-origin: 39px 21px; }

    /* Приховані за замовчуванням іскри */
    .pantograph-spark {
      opacity: 0;
    }

    /* ==========================================================================
       1. АНІМАЦІЯ РУХУ ПОТЯГА (ШАТУН / ПЕРЕКЛАДИНА МІЖ КОЛЕСАМИ)
       Класи, що змінюють стани анімації:
       - .state-drive (на кореневому тегу &lt;svg&gt;) — запускає круговий поступальний
         рух шатунів (#coupling-rod-rear та #coupling-rod-front) радіусом 3px.
         Завдяки зміщенню по колу без повороту (translate) перекладини залишаються
         строго паралельними землі протягом усього циклу, а також додається легке
         погойдування корпусу (#train-chassis) та біг шпал (#sleepers-group).
       ========================================================================== */
    .state-drive #coupling-rod-rear,
    .state-drive #coupling-rod-front {
      animation: couplingRodCircle 0.8s linear infinite;
    }
    .state-drive #train-chassis {
      animation: trainBodyBounce 0.4s ease-in-out infinite alternate;
    }
    .state-drive #sleepers-group {
      animation: sleepersMove 0.4s linear infinite;
    }

    /* Рівномірний рух по колу радіусом R = 3px (послідовні точки кола через 45°)
       без використання rotate(), щоб перекладина завжди була паралельною землі */
    @keyframes couplingRodCircle {
      0%    { transform: translate(3px, 0px); }
      12.5% { transform: translate(2.12px, 2.12px); }
      25%   { transform: translate(0px, 3px); }
      37.5% { transform: translate(-2.12px, 2.12px); }
      50%   { transform: translate(-3px, 0px); }
      62.5% { transform: translate(-2.12px, -2.12px); }
      75%   { transform: translate(0px, -3px); }
      87.5% { transform: translate(2.12px, -2.12px); }
      100%  { transform: translate(3px, 0px); }
    }

    @keyframes trainBodyBounce {
      0%   { transform: translateY(0px); }
      100% { transform: translateY(-1px); }
    }

    @keyframes sleepersMove {
      0%   { transform: translateX(0px); }
      100% { transform: translateX(-18px); }
    }

    /* ==========================================================================
       2. АНІМАЦІЯ ЗАПУСКУ ДВИГУНА (ЕЛЕКТРИЧНІ ІСКРИ БІЛЯ ПАНТОГРАФА)
       Класи, що змінюють стани анімації:
       - .state-start (на кореневому тегу &lt;svg&gt;) — активує спалахи маленьких
         жовтих іскор (.spark-1, .spark-2, .spark-3) біля верхньої планки
         пантографа (#pantograph) та легку вібрацію корпусу (#train-chassis).
       ========================================================================== */
    .state-start #train-chassis {
      animation: engineStartVibrate 0.12s ease-in-out infinite alternate;
    }
    .state-start .spark-1 {
      animation: sparkFlashA 1.1s ease-out infinite 0s;
    }
    .state-start .spark-2 {
      animation: sparkFlashB 1.1s ease-out infinite 0.35s;
    }
    .state-start .spark-3 {
      animation: sparkFlashC 1.1s ease-out infinite 0.7s;
    }

    @keyframes sparkFlashA {
      0%, 10%  { opacity: 0; transform: translate(0px, 0px) scale(0.3); }
      18%      { opacity: 1; transform: translate(-3px, -5px) scale(1.15); }
      32%      { opacity: 0.9; transform: translate(-6px, -8px) scale(0.85); }
      45%, 100%{ opacity: 0; transform: translate(-8px, -10px) scale(0.2); }
    }

    @keyframes sparkFlashB {
      0%, 10%  { opacity: 0; transform: translate(0px, 0px) scale(0.3); }
      18%      { opacity: 1; transform: translate(4px, -6px) scale(1.2); }
      32%      { opacity: 0.85; transform: translate(7px, -9px) scale(0.8); }
      45%, 100%{ opacity: 0; transform: translate(9px, -11px) scale(0.2); }
    }

    @keyframes sparkFlashC {
      0%, 10%  { opacity: 0; transform: translate(0px, 0px) scale(0.3); }
      18%      { opacity: 1; transform: translate(0px, -7px) scale(1.25); }
      32%      { opacity: 0.9; transform: translate(-1px, -11px) scale(0.9); }
      45%, 100%{ opacity: 0; transform: translate(-2px, -13px) scale(0.2); }
    }

    @keyframes engineStartVibrate {
      0%   { transform: translateY(0px); }
      100% { transform: translateY(-0.8px); }
    }
  </style>

  <!-- РЕЙКИ ТА ШПАЛИ -->
  <rect x="4" y="103" width="120" height="4" rx="2" fill="#78909C" />
  <g id="sleepers-group" fill="#5D4037">
    <rect x="10" y="107" width="8" height="4" rx="1" />
    <rect x="28" y="107" width="8" height="4" rx="1" />
    <rect x="46" y="107" width="8" height="4" rx="1" />
    <rect x="64" y="107" width="8" height="4" rx="1" />
    <rect x="82" y="107" width="8" height="4" rx="1" />
    <rect x="100" y="107" width="8" height="4" rx="1" />
    <rect x="118" y="107" width="8" height="4" rx="1" />
  </g>

  <!-- ГРУПА ПОТЯГА (ПАНТОГРАФ, ІСКРИ, КОРПУС) -->
  <g id="train-chassis">
    <!-- Пантограф (антена) на даху -->
    <g id="pantograph">
      <path d="M 30 43 L 40 32 L 32 25 L 48 25" fill="none" stroke="#455A64" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="28" y1="25" x2="52" y2="25" stroke="#263238" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- ЖОВТІ ІСКРИ БІЛЯ АНТЕННИ (відображаються при активному класі .state-start) -->
    <g id="pantograph-sparks" filter="url(#sparkGlow)">
      <!-- Іскра 1 (ліворуч) -->
      <g class="pantograph-spark spark-1">
        <polygon points="33,19 34.2,22 37,23 34.2,24 33,27 31.8,24 29,23 31.8,22" fill="#FFEB3B" stroke="#F57F17" stroke-width="0.6" />
        <circle cx="29" cy="20" r="1.1" fill="#FFF59D" />
      </g>
      <!-- Іскра 2 (праворуч) -->
      <g class="pantograph-spark spark-2">
        <polygon points="45,19 46.2,22 49,23 46.2,24 45,27 43.8,24 41,23 43.8,22" fill="#FFEB3B" stroke="#F57F17" stroke-width="0.6" />
        <circle cx="49" cy="20" r="1.1" fill="#FFF59D" />
      </g>
      <!-- Іскра 3 (по центру вгору) -->
      <g class="pantograph-spark spark-3">
        <polygon points="39,17 40.3,20 43.5,21 40.3,22 39,25 37.7,22 34.5,21 37.7,20" fill="#FFF176" stroke="#F57F17" stroke-width="0.6" />
        <circle cx="37" cy="17.5" r="1" fill="#FFFFFF" />
        <circle cx="41.5" cy="18" r="0.9" fill="#FFEB3B" />
      </g>
    </g>

    <!-- Корпус швидкісного потяга -->
    <path d="M 8 86
             L 8 50
             C 8 45, 12 43, 18 43
             L 78 43
             C 92 43, 108 55, 119 74
             C 122 79, 121 86, 115 88
             L 12 88
             C 9 88, 8 87, 8 86 Z" fill="url(#trainTop)" stroke="#546E7A" stroke-width="2.2" stroke-linejoin="round" />

    <!-- Синя декоративна смуга -->
    <path d="M 8 73 L 118 73 C 120 77, 120 81, 118 84 L 8 84 Z" fill="url(#trainStripe)" />

    <!-- Тонка червона акцентна лінія -->
    <line x1="8" y1="71.5" x2="116" y2="71.5" stroke="#E53935" stroke-width="2" />

    <!-- Лобове скло кабіни машиніста -->
    <path d="M 86 48 C 96 51, 106 59, 112 68 L 86 68 Z" fill="url(#trainWindow)" stroke="#01579B" stroke-width="1.8" stroke-linejoin="round" />

    <!-- Пасажирські вікна -->
    <rect x="15" y="51" width="16" height="15" rx="3" fill="url(#trainWindow)" stroke="#01579B" stroke-width="1.8" />
    <rect x="37" y="51" width="16" height="15" rx="3" fill="url(#trainWindow)" stroke="#01579B" stroke-width="1.8" />
    <rect x="59" y="51" width="16" height="15" rx="3" fill="url(#trainWindow)" stroke="#01579B" stroke-width="1.8" />

    <!-- Прожектор спереду -->
    <ellipse cx="117" cy="79" rx="2.5" ry="3.5" fill="#FFF59D" stroke="#F57F17" stroke-width="1.2" />
  </g>

  <!-- КОЛЕСА, ВІЗКИ ТА ШАТУНИ (ПЕРЕКЛАДИНИ МІЖ КОЛЕСАМИ) -->
  <g fill="#37474F" stroke="#1C313A" stroke-width="1.8">
    <circle cx="24" cy="96" r="6.5" />
    <circle cx="40" cy="96" r="6.5" />
    <circle cx="84" cy="96" r="6.5" />
    <circle cx="100" cy="96" r="6.5" />
  </g>
  <g fill="#B0BEC5">
    <circle cx="24" cy="96" r="2.5" />
    <circle cx="40" cy="96" r="2.5" />
    <circle cx="84" cy="96" r="2.5" />
    <circle cx="100" cy="96" r="2.5" />
  </g>
  <rect x="18" y="90" width="28" height="5" rx="2" fill="#455A64" />
  <rect x="78" y="90" width="28" height="5" rx="2" fill="#455A64" />

  <!-- Перекладина (зчіпний шатун) заднього візка -->
  <g id="coupling-rod-rear">
    <rect x="22.5" y="94.5" width="19" height="3" rx="1.5" fill="#CFD8DC" stroke="#263238" stroke-width="1.1" />
    <circle cx="24" cy="96" r="1.4" fill="#E53935" />
    <circle cx="40" cy="96" r="1.4" fill="#E53935" />
  </g>

  <!-- Перекладина (зчіпний шатун) переднього візка -->
  <g id="coupling-rod-front">
    <rect x="82.5" y="94.5" width="19" height="3" rx="1.5" fill="#CFD8DC" stroke="#263238" stroke-width="1.1" />
    <circle cx="84" cy="96" r="1.4" fill="#E53935" />
    <circle cx="100" cy="96" r="1.4" fill="#E53935" />
  </g>
</svg>