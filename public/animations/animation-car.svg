<svg id="car-svg" xmlns="http://www.w3.org/2000/svg" viewBox="-22 0 150 128" width="150" height="128">
  <defs>
    <!-- Градієнт кузова -->
    <linearGradient id="carBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="55%" stop-color="#E53935" />
      <stop offset="100%" stop-color="#B71C1C" />
    </linearGradient>
    <!-- Градієнт скла -->
    <linearGradient id="windowGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E1F5FE" />
      <stop offset="100%" stop-color="#4FC3F7" />
    </linearGradient>
    <!-- Градієнт колісного диска -->
    <radialGradient id="wheelRim" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#CFD8DC" />
      <stop offset="100%" stop-color="#90A4AE" />
    </radialGradient>
    <!-- Градієнт вихлопних газів -->
    <radialGradient id="smokeGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ECEFF1" />
      <stop offset="70%" stop-color="#B0BEC5" />
      <stop offset="100%" stop-color="#78909C" />
    </radialGradient>
  </defs>

  <style>
    /* ==========================================================================
       БАЗОВІ НАЛАШТУВАННЯ ТА ОПОРНІ ТОЧКИ (TRANSFORM-ORIGIN)
       ========================================================================== */
    #car-chassis {
      transform-origin: 66px 75px;
    }
    /* Центри коліс для рівномірного обертання */
    #rear-wheel {
      transform-origin: 35px 92px;
    }
    #front-wheel {
      transform-origin: 95px 92px;
    }

    /* Клуби диму приховані за замовчуванням */
    .exhaust-puff {
      opacity: 0;
      transform-origin: 6px 88px;
    }

    /* ==========================================================================
       1. АНІМАЦІЯ ЇЗДИ АВТОМОБІЛЯ
       Класи, що змінюють стани анімації:
       - .state-drive (на кореневому тегу &lt;svg&gt;) — запускає безперервне обертання
         заднього (#rear-wheel) та переднього (#front-wheel) коліс (зі спицями для
         видимості руху), а також легку дорожню вібрацію кузова (#car-chassis).
       ========================================================================== */
    .state-drive #rear-wheel,
    .state-drive #front-wheel {
      animation: wheelSpin 0.55s linear infinite;
    }
    .state-drive #car-chassis {
      animation: chassisDriveBounce 0.28s ease-in-out infinite alternate;
    }

    @keyframes wheelSpin {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes chassisDriveBounce {
      0%   { transform: translateY(0px); }
      100% { transform: translateY(-1.5px); }
    }

    /* ==========================================================================
       2. АНІМАЦІЯ ЗАПУСКУ ДВИГУНА (ВИХЛОПНІ ГАЗИ)
       Класи, що змінюють стани анімації:
       - .state-start (на кореневому тегу &lt;svg&gt;) — активує почерговий вихід
         клубів диму (.puff-1, .puff-2, .puff-3) із вихлопної труби (#exhaust-pipe)
         вліво та вгору, а також легку вібрацію кузова (#car-chassis) від роботи мотора.
       ========================================================================== */
    .state-start #car-chassis {
      animation: engineStartShake 0.14s ease-in-out infinite alternate;
    }
    .state-start .puff-1 {
      animation: exhaustRise 1.5s ease-out 0s 1 both;
    }
    .state-start .puff-2 {
      animation: exhaustRise 1.5s ease-out 0.5s 1 both;
    }
    .state-start .puff-3 {
      animation: exhaustRise 1.5s ease-out 1s 1 both;
    }

    @keyframes exhaustRise {
      0% {
        opacity: 0;
        transform: translate(0px, 0px) scale(0.35);
      }
      20% {
        opacity: 0.85;
      }
      75% {
        opacity: 0.45;
      }
      100% {
        opacity: 0;
        transform: translate(-18px, -28px) scale(1.35);
      }
    }

    @keyframes engineStartShake {
      0%   { transform: translate(0px, 0px) rotate(0deg); }
      100% { transform: translate(0px, -1px) rotate(-0.4deg); }
    }
  </style>

  <!-- ВИХЛОПНІ ГАЗИ (з'являються при активному класі .state-start) -->
  <g id="exhaust-smoke-group">
    <!-- Перший клуб диму -->
    <g class="exhaust-puff puff-1">
      <circle cx="5" cy="87" r="4.5" fill="url(#smokeGrad)" />
      <circle cx="2" cy="85" r="3.2" fill="url(#smokeGrad)" />
      <circle cx="7" cy="84" r="3" fill="url(#smokeGrad)" />
    </g>
    <!-- Другий клуб диму -->
    <g class="exhaust-puff puff-2">
      <circle cx="5" cy="87" r="5" fill="url(#smokeGrad)" />
      <circle cx="1.5" cy="86" r="3.5" fill="url(#smokeGrad)" />
      <circle cx="6.5" cy="83.5" r="3.2" fill="url(#smokeGrad)" />
    </g>
    <!-- Третій клуб диму -->
    <g class="exhaust-puff puff-3">
      <circle cx="5" cy="87" r="4.2" fill="url(#smokeGrad)" />
      <circle cx="2.5" cy="84.5" r="3" fill="url(#smokeGrad)" />
      <circle cx="7.5" cy="85" r="2.8" fill="url(#smokeGrad)" />
    </g>
  </g>

  <!-- ГРУПА КУЗОВА АВТОМОБІЛЯ -->
  <g id="car-chassis">
    <!-- Вихлопна труба -->
    <rect id="exhaust-pipe" x="5" y="86.5" width="6" height="3.5" rx="1.2" fill="#546E7A" stroke="#263238" stroke-width="1.3" />

    <!-- Кузов автомобіля -->
    <path d="M 12 88
             L 12 72
             C 12 66, 16 63, 24 62
             L 36 44
             C 40 39, 46 37, 54 37
             L 78 37
             C 85 37, 90 40, 95 46
             L 106 61
             C 115 63, 120 67, 120 74
             L 120 88
             C 120 91, 117 93, 113 93
             L 17 93
             C 14 93, 12 91, 12 88 Z" fill="url(#carBody)" stroke="#8E0000" stroke-width="2.2" stroke-linejoin="round" />

    <!-- Світлий відблиск уздовж кузова -->
    <path d="M 18 67 L 108 67" stroke="#FF8A80" stroke-width="2" stroke-linecap="round" opacity="0.7" />

    <!-- Заднє вікно -->
    <path d="M 32 60 L 41 45 C 43 42, 46 41, 50 41 L 61 41 L 61 60 Z" fill="url(#windowGlass)" stroke="#0277BD" stroke-width="1.8" stroke-linejoin="round" />

    <!-- Переднє вікно -->
    <path d="M 66 41 L 78 41 C 83 41, 86 43, 89 47 L 99 60 L 66 60 Z" fill="url(#windowGlass)" stroke="#0277BD" stroke-width="1.8" stroke-linejoin="round" />

    <!-- Відблиски на склі -->
    <path d="M 44 57 L 51 44 M 72 57 L 79 44" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.65" />

    <!-- Дверна ручка -->
    <rect x="68" y="69" width="7" height="2.8" rx="1.4" fill="#ECEFF1" stroke="#546E7A" stroke-width="1" />

    <!-- Передня фара -->
    <path d="M 114 68 C 118 68, 120 71, 120 75 L 114 75 Z" fill="#FFF59D" stroke="#F57F17" stroke-width="1.5" />

    <!-- Задній ліхтар -->
    <path d="M 12 68 C 15 68, 17 69, 17 72 L 17 76 L 12 76 Z" fill="#FFAB40" stroke="#BF360C" stroke-width="1.5" />

    <!-- Бампери -->
    <rect x="9" y="84" width="10" height="7" rx="3" fill="#455A64" stroke="#263238" stroke-width="1.6" />
    <rect x="111" y="84" width="11" height="7" rx="3" fill="#455A64" stroke="#263238" stroke-width="1.6" />
  </g>

  <!-- ЗАДНЄ КОЛЕСО (зі спицями та болтами для візуалізації обертання) -->
  <g id="rear-wheel">
    <circle cx="35" cy="92" r="15" fill="#263238" stroke="#102027" stroke-width="2" />
    <circle cx="35" cy="92" r="8.5" fill="url(#wheelRim)" stroke="#546E7A" stroke-width="1.6" />
    <!-- Спиці диска -->
    <path d="M 35 84.5 L 35 99.5 M 27.5 92 L 42.5 92 M 29.7 86.7 L 40.3 97.3 M 40.3 86.7 L 29.7 97.3" stroke="#78909C" stroke-width="1.3" stroke-linecap="round" />
    <circle cx="35" cy="92" r="3.2" fill="#546E7A" />
    <circle cx="35" cy="87.5" r="0.9" fill="#37474F" />
  </g>

  <!-- ПЕРЕДНЄ КОЛЕСО (зі спицями та болтами для візуалізації обертання) -->
  <g id="front-wheel">
    <circle cx="95" cy="92" r="15" fill="#263238" stroke="#102027" stroke-width="2" />
    <circle cx="95" cy="92" r="8.5" fill="url(#wheelRim)" stroke="#546E7A" stroke-width="1.6" />
    <!-- Спиці диска -->
    <path d="M 95 84.5 L 95 99.5 M 87.5 92 L 102.5 92 M 89.7 86.7 L 100.3 97.3 M 100.3 86.7 L 89.7 97.3" stroke="#78909C" stroke-width="1.3" stroke-linecap="round" />
    <circle cx="95" cy="92" r="3.2" fill="#546E7A" />
    <circle cx="95" cy="87.5" r="0.9" fill="#37474F" />
  </g>
</svg>