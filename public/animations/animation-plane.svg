<svg id="plane-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Градієнти корпусу літака -->
    <linearGradient id="planeBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CFD8DC" />
      <stop offset="45%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#B0BEC5" />
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ECEFF1" />
      <stop offset="100%" stop-color="#90A4AE" />
    </linearGradient>
    <linearGradient id="tailBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#42A5F5" />
      <stop offset="100%" stop-color="#1565C0" />
    </linearGradient>

    <!-- Градієнт реактивного полум'я з турбін -->
    <linearGradient id="jetFlameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FFEB3B" />
      <stop offset="65%" stop-color="#FF9800" />
      <stop offset="100%" stop-color="#F44336" stop-opacity="0" />
    </linearGradient>

    <!-- Ефект світіння для полум'я -->
    <filter id="flameGlow" x="-40%" y="-20%" width="180%" height="160%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* ==========================================================================
       БАЗОВІ НАЛАШТУВАННЯ ТА ОПОРНІ ТОЧКИ (TRANSFORM-ORIGIN)
       ========================================================================== */
    #plane-aircraft {
      transform-origin: 64px 64px;
    }

    /* Опорні точки для язиків полум'я (вирівняні строго по осі X кожної турбіни:
       зовнішня ліва x=23.5, внутрішня ліва x=40, внутрішня права x=88, зовнішня права x=104.5) */
    .flame-outer-left  { transform-origin: 23.5px 68px; }
    .flame-inner-left  { transform-origin: 40px 63px; }
    .flame-inner-right { transform-origin: 88px 63px; }
    .flame-outer-right { transform-origin: 104.5px 68px; }

    /* Елементи анімацій приховані за замовчуванням */
    .jet-flame,
    .air-intake-line,
    .air-exhaust-line {
      opacity: 0;
    }

    /* ==========================================================================
       1. АНІМАЦІЯ ЗАПУСКУ ДВИГУНІВ (РЕАКТИВНІ ЯЗИКИ ПОЛУМ'Я)
       Класи, що змінюють стани анімації:
       - .state-start — вмикає пульсацію язиків полум'я
         (.jet-flame, .flame-inner-left, .flame-inner-right, .flame-outer-left,
         .flame-outer-right) у задній частині крила строго на рівні кожної з 4-х
         турбін. Корпус літака (#plane-aircraft) при цьому залишається нерухомим.
       ========================================================================== */
    .state-start .flame-inner-left,
    .state-start .flame-inner-right {
      animation: flameFlickerInner 0.16s ease-in-out infinite alternate;
    }
    .state-start .flame-outer-left,
    .state-start .flame-outer-right {
      animation: flameFlickerOuter 0.19s ease-in-out infinite alternate;
    }

    @keyframes flameFlickerInner {
      0%   { opacity: 0.88; transform: scaleX(0.9) scaleY(0.85); }
      100% { opacity: 1;    transform: scaleX(1.1) scaleY(1.18); }
    }

    @keyframes flameFlickerOuter {
      0%   { opacity: 0.85; transform: scaleX(0.88) scaleY(0.82); }
      100% { opacity: 1;    transform: scaleX(1.08) scaleY(1.15); }
    }

    /* ==========================================================================
       2. АНІМАЦІЯ ПОЛЬОТУ ЛІТАКА (ПОТОКИ ПОВІТРЯ ВПЕРЕД І НАЗАД ВІД ТУРБІН)
       Класи, що змінюють стани анімації:
       - .state-fly — запускає рух тонких ліній
         всмоктування повітря спереду турбін (.air-intake-line, .intake-1, .intake-2)
         та виштовхування повітряного потоку позаду крила (.air-exhaust-line,
         .exhaust-1, .exhaust-2), а також легку вібрацію корпусу (#plane-aircraft).
       ========================================================================== */
    .state-fly #plane-aircraft {
      animation: engineSpoolVibrate 0.11s ease-in-out infinite alternate;
    }
    /* Лінії всмоктування повітря перед турбінами */
    .state-fly .intake-1 {
      animation: airIntakeFlow 0.85s ease-in infinite 0s;
    }
    .state-fly .intake-2 {
      animation: airIntakeFlow 0.85s ease-in infinite 0.42s;
    }
    /* Лінії виштовхування повітря позаду крила */
    .state-fly .exhaust-1 {
      animation: airExhaustFlow 0.85s ease-out infinite 0s;
    }
    .state-fly .exhaust-2 {
      animation: airExhaustFlow 0.85s ease-out infinite 0.42s;
    }

    @keyframes airIntakeFlow {
      0% {
        opacity: 0;
        stroke-dashoffset: 16;
        transform: translateY(-4px);
      }
      35% {
        opacity: 0.85;
      }
      100% {
        opacity: 0;
        stroke-dashoffset: 0;
        transform: translateY(6px);
      }
    }

    @keyframes airExhaustFlow {
      0% {
        opacity: 0.85;
        stroke-dashoffset: 20;
        transform: translateY(0px);
      }
      70% {
        opacity: 0.6;
      }
      100% {
        opacity: 0;
        stroke-dashoffset: 0;
        transform: translateY(14px);
      }
    }

    @keyframes engineSpoolVibrate {
      0%   { transform: translateX(-0.4px); }
      100% { transform: translateX(0.4px); }
    }
  </style>

  <!-- ОСНОВНА ГРУПА ЛІТАКА -->
  <g id="plane-aircraft">

    <!-- 1. ЯЗИКИ ПОЛУМ'Я (відображаються позаду крила при класі .state-start) -->
    <g id="jet-flames-group" filter="url(#flameGlow)">
      <!-- Полум'я зовнішньої лівої турбіни (x = 23.5) -->
      <g class="jet-flame flame-outer-left">
        <path d="M 21 68 C 21 75, 22.5 82, 23.5 85 C 24.5 82, 26 75, 26 68 Z" fill="url(#jetFlameGrad)" />
        <path d="M 22.3 68 C 22.3 72, 23 76, 23.5 78 C 24 76, 24.7 72, 24.7 68 Z" fill="#FFFFFF" opacity="0.9" />
      </g>
      <!-- Полум'я внутрішньої лівої турбіни (x = 40) -->
      <g class="jet-flame flame-inner-left">
        <path d="M 37 63 C 37 72, 38.8 80, 40 84 C 41.2 80, 43 72, 43 63 Z" fill="url(#jetFlameGrad)" />
        <path d="M 38.6 63 C 38.6 68, 39.4 73, 40 75 C 40.6 73, 41.4 68, 41.4 63 Z" fill="#FFFFFF" opacity="0.9" />
      </g>
      <!-- Полум'я внутрішньої правої турбіни (x = 88) -->
      <g class="jet-flame flame-inner-right">
        <path d="M 85 63 C 85 72, 86.8 80, 88 84 C 89.2 80, 91 72, 91 63 Z" fill="url(#jetFlameGrad)" />
        <path d="M 86.6 63 C 86.6 68, 87.4 73, 88 75 C 88.6 73, 89.4 68, 89.4 63 Z" fill="#FFFFFF" opacity="0.9" />
      </g>
      <!-- Полум'я зовнішньої правої турбіни (x = 104.5) -->
      <g class="jet-flame flame-outer-right">
        <path d="M 102 68 C 102 75, 103.5 82, 104.5 85 C 105.5 82, 107 75, 107 68 Z" fill="url(#jetFlameGrad)" />
        <path d="M 103.3 68 C 103.3 72, 104 76, 104.5 78 C 105 76, 105.7 72, 105.7 68 Z" fill="#FFFFFF" opacity="0.9" />
      </g>
    </g>

    <!-- 2. ПОТОКИ ПОВІТРЯ ПІД ЧАС ПОЛЬОТУ (відображаються при класі .state-fly) -->
    <g id="airflow-lines-group" fill="none" stroke="#81D4FA" stroke-width="1.2" stroke-linecap="round">
      <!-- Тонкі лінії всмоктування повітря передньою частиною турбін -->
      <g class="air-intake-line intake-1" stroke-dasharray="10 6">
        <!-- Ліве крило -->
        <path d="M 19 41 Q 21.5 47 22.5 53" />
        <path d="M 28 41 Q 25.5 47 24.5 53" />
        <path d="M 35 34 Q 37.5 40 38.8 46" />
        <path d="M 45 34 Q 42.5 40 41.2 46" />
        <!-- Праве крило -->
        <path d="M 83 34 Q 85.5 40 86.8 46" />
        <path d="M 93 34 Q 90.5 40 89.2 46" />
        <path d="M 100 41 Q 102.5 47 103.5 53" />
        <path d="M 109 41 Q 106.5 47 105.5 53" />
      </g>
      <g class="air-intake-line intake-2" stroke="#E1F5FE" stroke-dasharray="8 8">
        <path d="M 23.5 39 L 23.5 52" />
        <path d="M 40 32 L 40 45" />
        <path d="M 88 32 L 88 45" />
        <path d="M 104.5 39 L 104.5 52" />
      </g>

      <!-- Тонкі лінії виштовхування повітря позаду крила -->
      <g class="air-exhaust-line exhaust-1" stroke-dasharray="12 8">
        <!-- Позаду лівого крила -->
        <line x1="22" y1="71" x2="21.5" y2="87" />
        <line x1="25" y1="71" x2="25.5" y2="87" />
        <line x1="38.5" y1="67" x2="38" y2="85" />
        <line x1="41.5" y1="67" x2="42" y2="85" />
        <!-- Позаду правого крила -->
        <line x1="86.5" y1="67" x2="86" y2="85" />
        <line x1="89.5" y1="67" x2="90" y2="85" />
        <line x1="103" y1="71" x2="102.5" y2="87" />
        <line x1="106" y1="71" x2="106.5" y2="87" />
      </g>
      <g class="air-exhaust-line exhaust-2" stroke="#B3E5FC" stroke-dasharray="9 9">
        <line x1="23.5" y1="70" x2="23.5" y2="89" />
        <line x1="40" y1="66" x2="40" y2="88" />
        <line x1="88" y1="66" x2="88" y2="88" />
        <line x1="104.5" y1="70" x2="104.5" y2="89" />
      </g>
    </g>

    <!-- Двигуни під крилами -->
    <rect x="36" y="47" width="8" height="16" rx="4" fill="#546E7A" stroke="#263238" stroke-width="1.8" />
    <rect x="84" y="47" width="8" height="16" rx="4" fill="#546E7A" stroke="#263238" stroke-width="1.8" />
    <rect x="20" y="54" width="7" height="14" rx="3.5" fill="#546E7A" stroke="#263238" stroke-width="1.8" />
    <rect x="101" y="54" width="7" height="14" rx="3.5" fill="#546E7A" stroke="#263238" stroke-width="1.8" />

    <!-- Основні крила -->
    <path d="M 55 44 L 8 68 L 8 76 L 55 66 Z" fill="url(#wingGrad)" stroke="#455A64" stroke-width="2" stroke-linejoin="round" />
    <path d="M 73 44 L 120 68 L 120 76 L 73 66 Z" fill="url(#wingGrad)" stroke="#455A64" stroke-width="2" stroke-linejoin="round" />

    <!-- Закінцівки крил -->
    <path d="M 8 68 L 5 64 L 8 76 Z" fill="url(#tailBlue)" />
    <path d="M 120 68 L 123 64 L 120 76 Z" fill="url(#tailBlue)" />

    <!-- Хвостові стабілізатори -->
    <path d="M 58 98 L 36 112 L 36 118 L 59 111 Z" fill="url(#tailBlue)" stroke="#0D47A1" stroke-width="1.8" stroke-linejoin="round" />
    <path d="M 70 98 L 92 112 L 92 118 L 69 111 Z" fill="url(#tailBlue)" stroke="#0D47A1" stroke-width="1.8" stroke-linejoin="round" />

    <!-- Фюзеляж -->
    <path d="M 64 8
             C 71 8, 75 20, 75 34
             L 75 86
             C 75 98, 70 112, 64 120
             C 58 112, 53 98, 53 86
             L 53 34
             C 53 20, 57 8, 64 8 Z" fill="url(#planeBody)" stroke="#455A64" stroke-width="2.2" stroke-linejoin="round" />

    <!-- Скло кабіни пілотів -->
    <path d="M 57 22 C 60 18, 68 18, 71 22 L 69 25 C 66 23, 62 23, 59 25 Z" fill="#29B6F6" stroke="#0277BD" stroke-width="1.4" stroke-linejoin="round" />

    <!-- Ілюмінатори вздовж фюзеляжу -->
    <g fill="#455A64">
      <circle cx="56" cy="36" r="1.2" />
      <circle cx="56" cy="42" r="1.2" />
      <circle cx="56" cy="72" r="1.2" />
      <circle cx="56" cy="78" r="1.2" />
      <circle cx="56" cy="84" r="1.2" />

      <circle cx="72" cy="36" r="1.2" />
      <circle cx="72" cy="42" r="1.2" />
      <circle cx="72" cy="72" r="1.2" />
      <circle cx="72" cy="78" r="1.2" />
      <circle cx="72" cy="84" r="1.2" />
    </g>

    <!-- Вертикальний кіль хвоста -->
    <path d="M 64 95 L 66 121 L 62 121 Z" fill="url(#tailBlue)" stroke="#0D47A1" stroke-width="1.5" stroke-linejoin="round" />
  </g>
</svg>